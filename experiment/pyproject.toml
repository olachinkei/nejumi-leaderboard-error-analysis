[project]
name = "nejumi-leaderboard-failure-analysis"
version = "0.1.0"
description = "Reproducible item-level failure analysis for Nejumi Leaderboard 4"
requires-python = ">=3.11,<3.13"
dependencies = [
  "absl-py>=2,<3",
  "immutabledict>=4,<5",
  "ja-sentence-segmenter>=0.2,<0.3",
  "janome>=0.5,<0.6",
  "jinja2>=3.1,<4",
  "langdetect>=1.0,<2",
  "matplotlib>=3.8,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "pyarrow>=17,<24",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "wandb>=0.24,<0.25",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaderboard_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/leaderboard_analysis/build_report.py" = ["E501"]
"src/leaderboard_analysis/validate_scores.py" = ["E501"]
